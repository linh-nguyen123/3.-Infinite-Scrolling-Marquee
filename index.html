<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Scrolling Marquee</title>
    <!-- Liên kết file CSS bên ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="marquee-container">
        <h2 class="marquee-title">Infinite Scrolling Marquee</h2>
        <p class="marquee-subtitle">Hover the banner to pause it</p>

        <!-- Khung chứa thanh cuộn -->
        <div class="marquee">
            <div class="marquee-track">
                <!-- Nhóm mục 1 -->
                <div class="marquee-item">CSS</div>
                <div class="marquee-item">JavaScript</div>
                <div class="marquee-item">Git</div>
                <div class="marquee-item">GitHub</div>
                <div class="marquee-item">VS Code</div>
                <div class="marquee-item">HTML</div>
                
                <!-- Nhóm mục 2 (Lặp lại để tạo hiệu ứng chạy liền mạch không bị hụt) -->
                <div class="marquee-item">CSS</div>
                <div class="marquee-item">JavaScript</div>
                <div class="marquee-item">Git</div>
                <div class="marquee-item">GitHub</div>
                <div class="marquee-item">VS Code</div>
                <div class="marquee-item">HTML</div>
            </div>
        </div>
    </div>

</body>
</html>
